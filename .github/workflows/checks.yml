name: Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  all-checks:
    runs-on: macos-latest

    steps:
      # ══════════════════════════════════════════════════════════════════════
      # SETUP  (CI-only — not needed locally)
      # ══════════════════════════════════════════════════════════════════════

      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-java@v3
        id: setup-jdk
        with:
          java-version: "21"
          distribution: temurin

      - name: Export JAVA_HOME
        run: echo "JAVA_HOME=${{ steps.setup-jdk.outputs.java-home }}" >> $GITHUB_ENV

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore Gradle and Rust caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: ${{ runner.os }}-tooling-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-tooling-

      # Pinned package list: the action's DEFAULT is `tools platform-tools`, and
      # the legacy `tools` package no longer exists in the Android SDK
      # repository — sdkmanager fails with "Failed to find package 'tools'" and
      # the whole job dies before a single check runs. `cmdline-tools;latest` is
      # preinstalled on the runner (the action reports finding it), so only
      # platform-tools needs installing here.
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;29.0.14206865" --channel=0
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install tools
        run: |
          brew install swiftlint cocoapods xcbeautify
          brew tap mobile-dev-inc/tap
          brew install mobile-dev-inc/tap/maestro

      # ══════════════════════════════════════════════════════════════════════
      # ALL CHECKS  (lint · unit tests · iOS xcodebuild · Android APK build)
      # Maestro e2e tests are excluded (@Tag("e2e")) — they require a physical
      # Android emulator which GitHub's standard macOS runners don't support.
      # Run `./gradlew :checks:e2eTest` locally to execute the Maestro flows.
      # ══════════════════════════════════════════════════════════════════════

      # detekt is already wired into `allChecks` (see the aggregate task in
      # build.gradle.kts), so a separate invocation here would run it twice.
      - name: Run all checks
        run: ./gradlew allChecks

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: build/check-logs/**
          if-no-files-found: ignore
          retention-days: 5
